name: Python tests

on:
  push:
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "python[dev]"
      - name: Run unit tests (Phases 0-5; excluding slow + MATLAB-fixture-gated)
        working-directory: python
        run: pytest -v -m "not slow" --ignore=tests/test_experiments_smoke.py

      - name: Run experiment smoke tests (Phase 6)
        working-directory: python
        run: pytest -v tests/test_experiments_smoke.py
